services:
  - type: web
    name: techstore-assistant-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python scripts/ingest_shop.py"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        value: "8660932733"
      - key: ADMIN_PIN
        value: "1234"
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
